name: Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "native/**"
      - "smoke/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  wasmtime-cache:
    uses: ./.github/workflows/wasmtime-cache.yml

  release-nifs:
    needs: wasmtime-cache
    uses: leandrocp/github-actions/.github/workflows/nif-release.yml@de7373d31377bfeea8f5f0070e7af1f15ce04406
    with:
      locked: true
      project-name: mdex_native_nif
      project-dir: native/mdex_native_nif
      nif-module: MDExNative.Native
      smoke-project: smoke
      feature-variants: '[{"features":"lumis","variant":"lumis"},{"features":"syntect","variant":"syntect"},{"features":"","variant":""}]'
      r2-path: releases/download/${{ github.ref_name }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  hex-publish:
    needs: release-nifs
    if: startsWith(github.ref, 'refs/tags/v')
    uses: leandrocp/github-actions/.github/workflows/hex-publish.yml@main
    with:
      install-rust: true
      pre-publish-command: MDEX_NATIVE_BUILD=1 mix rustler_precompiled.download MDExNative.Native --all --print && mix escript.install hex ex_doc --force
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
