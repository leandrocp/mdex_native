name: Rust

on:
  push:
    branches:
      - main
    paths:
      - "native/**"
  pull_request:
    paths:
      - "native/**"
  workflow_dispatch:

jobs:
  test:
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      manifest-path: "native/mdex_native_nif/Cargo.toml"
      msrv: "1.95"

  # x86_64-pc-windows-gnu is the one release target without native thread
  # locals, so std backs `thread_local!` with OS TLS keys there. Run the tests
  # on it so the counting allocator in `memory.rs` is checked on that path too.
  test-windows-gnu:
    name: os windows-2022, target x86_64-pc-windows-gnu
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: x86_64-pc-windows-gnu
      - run: cargo test --locked --lib --target x86_64-pc-windows-gnu --manifest-path native/mdex_native_nif/Cargo.toml

  mutants:
    name: mutants (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/mdex_native_nif
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native/mdex_native_nif
          key: mutants
      - run: cargo install --locked cargo-mutants@27.1.0
      - run: git diff --relative "origin/${{ github.base_ref }}..." -- '*.rs' > "$RUNNER_TEMP/pr.diff"
      # Missed (2) and timed-out (3) mutants only warn for now.
      - run: |
          status=0
          timeout 25m cargo mutants --in-place --no-shuffle -vV --cargo-arg=--locked --in-diff "$RUNNER_TEMP/pr.diff" || status=$?
          case "$status" in
            0 | 2 | 3) ;;
            124) echo "::warning::cargo-mutants did not finish within 25 minutes" ;;
            *) exit "$status" ;;
          esac

  lint:
    uses: leandrocp/github-actions/.github/workflows/rust-lint.yml@main
    with:
      manifest-path: "native/mdex_native_nif/Cargo.toml"
      msrv: "1.95"
