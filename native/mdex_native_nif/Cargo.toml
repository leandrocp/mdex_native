[package]
name = "mdex_native_nif"
version = "0.1.0"
authors = ["Leandro Pereira"]
edition = "2021"
rust-version = "1.95"

[lints.clippy]
cognitive_complexity = "deny"

[lib]
name = "mdex_native_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ammonia = "4.1"
anyhow = "1"
once_cell = "1.21"
comrak = { version = "0.56", default-features = false, features = [
  "attributes",
  "shortcodes",
  "phoenix_heex",
] }
# The same two crates `lumis_nif` links, with `rustler` for the option
# decoders the two NIFs share. They share no runtime; see ARCHITECTURE.md.
lumis-core = { version = "4.0.0", default-features = false, features = ["all-languages", "rustler"], optional = true }
lumis-wasm-runtime = { version = "0.5.0", optional = true }
lol_html = "3.0"
parking_lot = "0.12"
phf = { version = "0.14", features = ["macros"] }
rustler = "0.39"
serde = "1.0"
shlex = "2.0.1"
two-face = { version = "0.5", optional = true }
typed-arena = "2.0"
v_htmlescape = "0.17"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["nif_version_2_15"]
lumis = ["dep:lumis-core", "dep:lumis-wasm-runtime"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
syntect = ["comrak/syntect", "dep:two-face"]


# Temporary, until the shared decoder and runtime changes publish to crates.io.
# Keep both crates on the same Lumis revision for reproducible integration tests.
# Remove these patches and require the published versions at release.
[patch.crates-io]
lumis-core = { git = "https://github.com/leandrocp/lumis", rev = "3f983fb2e611c8c0c4c8ed474b557ed24df465c5" }
lumis-wasm-runtime = { git = "https://github.com/leandrocp/lumis", rev = "3f983fb2e611c8c0c4c8ed474b557ed24df465c5" }
