[package]
name = "mdex_native_nif"
version = "0.1.0"
authors = ["Leandro Pereira"]
edition = "2021"
rust-version = "1.91"

[lints.clippy]
cognitive_complexity = "deny"

[lib]
name = "mdex_native_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ammonia = "4.1"
anyhow = "1"
once_cell = "1.21"
comrak = { version = "0.55", default-features = false, features = [
  "attributes",
  "shortcodes",
  "phoenix_heex",
] }
# Only the formatters, themes and option decoders. The highlighter itself
# lives in the `:lumis` NIF and is reached over dyncall. Temporary exact ref
# until lumis-core 2.6.0 publishes the `rustler` feature; swap before merging.
lumis-core = { git = "https://github.com/leandrocp/lumis", rev = "fa4de747742f6aefe7b64d062ae81493ac0e0434", default-features = false, features = ["all-languages", "rustler"], optional = true }
lol_html = "3.0"
parking_lot = "0.12"
phf = { version = "0.14", features = ["macros"] }
rustler = { version = "0.38", features = ["nif_version_2_16"] }
serde = "1.0"
shlex = "2.0.1"
two-face = { version = "0.5", optional = true }
typed-arena = "2.0"
v_htmlescape = "0.17"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["nif_version_2_16"]
lumis = ["dep:lumis-core"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
syntect = ["comrak/syntect", "dep:two-face"]
