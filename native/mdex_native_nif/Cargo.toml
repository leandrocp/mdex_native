[package]
name = "mdex_native_nif"
version = "0.1.0"
authors = ["Leandro Pereira"]
edition = "2021"
rust-version = "1.91"

[lib]
name = "mdex_native_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ammonia = "4.1"
comrak = { version = "0.54", default-features = false, features = [
  "attributes",
  "shortcodes",
  "phoenix_heex",
] }
lol_html = "3.0"
parking_lot = "0.12"
phf = { version = "0.14", features = ["macros"] }
rustler = { version = "0.38", default-features = false }
serde = "1.0"
shlex = "2.0.1"
two-face = { version = "0.5", optional = true }
typed-arena = "2.0"
v_htmlescape = "0.17"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["nif_version_2_16"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
syntect = ["comrak/syntect", "dep:two-face"]
